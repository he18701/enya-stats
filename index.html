  function getLeader(players, key) {
    let best = null, bestVal = -Infinity;

      if (v > bestVal) {

  const COURT = {
    W: 500,
    H: 466,

  function isThreePoint(x, y) {
    if (x <= COURT.corner || x >= COURT.W - COURT.corner) return true;
    const dx = x - COURT.bx, dy = y - COURT.by;
    return Math.sqrt(dx * dx + dy * dy) > COURT.arc3;
  }
  function sum(players, key) {
    return players.filter(isRealPlayer).reduce((a, p) => a + (Number(p[key]) || 0), 0);

  function toNumeric(field, raw) {
    if (raw == null) return "";
    const v = String(raw).trim();
    if (NUM_FIELDS.has(field)) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }
    return v;
  }
  function statValue(player, statKey) {
    if (statKey === "2P%") {
      const m = Number(player["2PM"]) || 0, a = Number(player["2PA"]) || 0;
      return a > 0 ? Math.round(m / a * 100) : null;
    }
    if (statKey === "3P%") {
      const m = Number(player["3PM"]) || 0, a = Number(player["3PA"]) || 0;
      return a > 0 ? Math.round(m / a * 100) : null;
    }
    if (statKey === "FT%") {
      const m = Number(player["FTM"]) || 0, a = Number(player["FTA"]) || 0;
      return a > 0 ? Math.round(m / a * 100) : null;
    }
    if (statKey === "FG%") {
      const m = Number(player["FGM"]) || 0, a = Number(player["FGA"]) || 0;
      return a > 0 ? Math.round(m / a * 100) : null;
    }
    return Number(player[statKey]) || 0;
  }
  function parseRoster(text) {
    if (!text || !text.trim()) return [];
    const res = Papa.parse(text.trim(), { skipEmptyLines: true });
    let rows = res.data;
    if (!rows.length) return [];
    const first = rows[0].map((c) => String(c).trim());
    if (first[0] && /name/i.test(first[0])) rows = rows.slice(1);
    const players = [];
    for (const r of rows) {
      if (!r[0] || !String(r[0]).trim()) continue;
      const p = {};
      FIELDS.forEach((f, i) => {
        p[f] = toNumeric(f, r[i]);
      });
      players.push(p);
    }
    return players;
  }
  function computeScore(players) {
    return sum(players, "PTS");
  }
  function playerToRow(gameId, side, player) {
    const row = { game_id: gameId, side };
    for (const f of FIELDS) {
      const col = DB_FIELD_MAP[f];
      row[col] = player[f] === "" ? null : player[f];

    return row;
  }
  function rowToPlayer(row) {
    const p = {};
    for (const f of FIELDS) {
      const col = DB_FIELD_MAP[f];
      p[f] = row[col] == null ? "" : row[col];
    }
    return p;
  }
  async function loadGames() {

  async function syncShotsToStats(gameId, shots) {
    const byPlayer = {};
    for (const s of shots) {
      if (!byPlayer[s.player]) byPlayer[s.player] = { m2: 0, a2: 0, m3: 0, a3: 0 };
      const p = byPlayer[s.player];
      if (s.three) {
        p.a3++;
        if (s.made) p.m3++;
      } else {
        p.a2++;
        if (s.made) p.m2++;
      }
    }
    for (const [name, d] of Object.entries(byPlayer)) {
      const fgm = d.m2 + d.m3, fga = d.a2 + d.a3;
      const pts = d.m2 * 2 + d.m3 * 3;
      const fg_pct = fga ? Math.round(fgm / fga * 100) + "%" : "-%";
      const pct2 = d.a2 ? Math.round(d.m2 / d.a2 * 100) + "%" : "-%";

      const newOrder = games.map((g) => g.id);
